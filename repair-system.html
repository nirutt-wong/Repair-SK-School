<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบแจ้งซ่อม งานอาคารสถานที่</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#4f8a3c; --green-d:#3a6b2a; --green-l:#e8f2e0;
  --yellow:#f4c430; --yellow-l:#fff7d6;
  --ink:#27331f; --mute:#6b7761; --line:#e3e8dc; --bg:#fbfcf7; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
header{width:calc(100% - 32px);max-width:968px;margin:0 auto;background:var(--green);color:#fff;padding:18px 0;border-bottom:5px solid var(--yellow)}
header .in{max-width:1000px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header .in>div{min-width:0}
#hdrRight{justify-content:flex-end}
#hdrRight button{white-space:nowrap}
.who{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header h1{margin:0;font-size:1.25rem;font-weight:600}
header small{opacity:.85;font-weight:300}
main{width:100%;flex:1;align-content:start;max-width:1000px;margin:24px auto;padding:0 16px;display:grid;gap:20px}
footer{width:calc(100% - 32px);max-width:968px;margin:24px auto 0;background:var(--green);color:#fff;padding:18px 0;border-top:5px solid var(--yellow)}
footer .in{max-width:1000px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer small{opacity:.85;font-weight:300}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2{margin:0 0 16px;font-size:1.05rem;font-weight:600;color:var(--green-d);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:6px;height:18px;background:var(--yellow);border-radius:3px}
label{display:block;font-size:.88rem;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font-weight:500;transition:.15s}
.btn{background:var(--green);color:#fff}.btn:hover{background:var(--green-d)}
.btn-y{background:var(--yellow);color:#3b3100}.btn-y:hover{filter:brightness(.95)}
.btn-o{background:#fff;color:var(--green-d);border:1px solid var(--green)}
.btn-sm{padding:5px 12px;font-size:.85rem}
.btn-w{background:#fff;color:var(--green-d)}.btn-w:hover{background:var(--yellow-l)}
.btn-r{background:#fff;color:#b4472f;border:1px solid #e0b3a8}
button:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{font-size:.78rem;color:var(--mute);background:var(--green-l);padding:4px 10px;border-radius:20px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{background:var(--green-l);color:var(--green-d);text-align:left;font-weight:600}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafdf5}
.badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:.8rem;font-weight:500}
.s-wait{background:var(--yellow-l);color:#8a6d00}
.s-ok{background:var(--green-l);color:var(--green-d)}
.s-no{background:#fbe6e1;color:#b4472f}
.s-done{background:var(--green);color:#fff}
.msg{padding:10px 14px;border-radius:10px;margin-top:12px;font-size:.9rem;display:none}
.msg.ok{display:block;background:var(--green-l);color:var(--green-d)}
.msg.err{display:block;background:#fbe6e1;color:#b4472f}
.empty{text-align:center;color:var(--mute);padding:24px}
a{color:var(--green-d)}
.modal{position:fixed;inset:0;background:rgba(30,40,20,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:880px;max-height:92vh;overflow:auto}
.who{font-size:.9rem}
/* print */
#printArea{display:none}
@media print{
  body{background:#fff}
  header,main,footer,.modal{display:none!important}
  #printArea{display:block}
  #printArea h2{margin:0 0 4px}
  #printArea table{font-size:12px}
  th{background:#eee!important;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>

<header><div class="in">
  <div><h1>🔧 ระบบแจ้งซ่อม งานอาคารสถานที่</h1><small>โรงเรียนสระแก้ว</small></div>
  <div class="row" id="hdrRight">
    <span class="who" id="who"></span>
    <button class="btn-y btn-sm" id="openReport" style="display:none">📄 รายงานการแจ้งซ่อม</button>
    <button class="btn-w btn-sm" id="loginBtn">🔑 เข้าสู่ระบบ</button>
    <button class="btn-w btn-sm" id="logout" style="display:none">ออกจากระบบ</button>
  </div>
</div></header>

<main>
  <!-- แบบฟอร์มแจ้งซ่อม -->
  <section class="card">
    <h2>แจ้งซ่อม</h2>
    <form id="form">
      <div class="grid2">
        <div><label>ชื่อผู้แจ้งซ่อม *</label><input id="name" required maxlength="100" placeholder="เช่น นายสมชาย ใจดี"></div>
        <div><label>สังกัด *</label>
          <select id="dept" required>
            <option value="">— เลือกสังกัด —</option>
            <option>ผู้บริหาร</option>
            <option>กลุ่มสาระคณิตศาสตร์</option>
            <option>กลุ่มสาระวิทยาศาสตร์และเทคโนโลยี</option>
            <option>กลุ่มสาระสังคมศึกษา ศาสนาและวัฒนธรรม</option>
            <option>กลุ่มสาระภาษาต่างประเทศ</option>
            <option>กลุ่มสาระศิลปะ</option>
            <option>กลุ่มสาระสุขศึกษาและพลศึกษา</option>
            <option>กลุ่มสาระการงานอาชีพ</option>
            <option>กลุ่มสาระภาษาไทย</option>
          </select></div>
        <div><label>รายการซ่อม *</label><input id="item" required maxlength="200" placeholder="เช่น หลอดไฟเสีย, ก๊อกน้ำรั่ว"></div>
        <div><label>จำนวน *</label><select id="qty" required><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option></select></div>
        <div><label>อาคาร *</label><input id="place" required maxlength="200" placeholder="เช่น อาคาร 2"></div>
        <div><label>ห้อง</label><input id="room" maxlength="100" placeholder="เช่น 203"></div>
        <div><label>วันที่แจ้งซ่อม *</label><input id="date" type="date" required></div>
        <div><label>แนบรูปภาพประกอบ (สูงสุด 3 รูป, ย่อให้ ≤ 2 MB อัตโนมัติ)</label>
          <input id="files" type="file" accept="image/*" multiple>
          <div class="thumbs" id="thumbs"></div></div>
      </div>
      <div class="row" style="margin-top:18px;justify-content:center">
        <button class="btn" id="submitBtn" type="submit">ส่งเรื่องแจ้งซ่อม</button>
      </div>
      <div class="msg" id="formMsg"></div>
    </form>
  </section>

  <!-- ตารางรายการ -->
  <section class="card">
    <h2>รายการแจ้งซ่อม (เรียงตามวันที่)</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>วันที่</th><th>ผู้แจ้ง</th><th>สังกัด</th><th>รายการ</th><th>จำนวน</th><th>สถานที่</th><th>รูป</th><th>สถานะ</th><th class="adm" style="display:none">อนุมัติ</th></tr></thead>
      <tbody id="list"><tr><td colspan="9" class="empty">กำลังโหลด…</td></tr></tbody>
    </table></div>
  </section>

</main>

<footer><div class="in">
  <div><strong>🔧 งานอาคารสถานที่</strong> · <small>โรงเรียนสระแก้ว</small></div>
  <small>ระบบแจ้งซ่อม</small>
</div></footer>

<!-- Pop-up เข้าสู่ระบบ -->
<div class="modal" id="loginModal"><div class="box" style="max-width:420px">
  <h2 style="margin-top:0;color:var(--green-d)">เข้าสู่ระบบ (ผู้อนุมัติ)</h2>
  <form id="loginForm">
    <label>อีเมล</label><input id="email" type="email" required autocomplete="username">
    <label>รหัสผ่าน</label><input id="pass" type="password" required autocomplete="current-password">
    <div class="row" style="margin-top:16px">
      <button class="btn" type="submit">เข้าสู่ระบบ</button>
      <button class="btn-o" type="button" id="loginCancel">ยกเลิก</button>
    </div>
  </form>
  <div class="msg" id="loginMsg"></div>
</div></div>

<!-- Pop-up อนุมัติ (เปิดจากลิงก์ในข้อความแจ้งเตือน) -->
<div class="modal" id="approveModal"><div class="box" style="max-width:480px">
  <h2 style="margin-top:0;color:var(--green-d)">อนุมัติรายการแจ้งซ่อม</h2>
  <div id="apBody"></div>
  <div class="row" style="margin-top:16px" id="apBtns">
    <button class="btn" id="apOk">อนุมัติ</button>
    <button class="btn-r" id="apNo">ไม่อนุมัติ</button>
    <button class="btn-o" id="apClose">ปิด</button>
  </div>
  <div class="msg" id="apMsg"></div>
</div></div>

<!-- Modal รายงาน -->
<div class="modal" id="reportModal"><div class="box">
  <h2 style="margin-top:0;color:var(--green-d)">รายงานการแจ้งซ่อม</h2>
  <div class="grid2">
    <div><label>ตั้งแต่วันที่ (ย้อนหลังได้ 3 เดือน)</label><input type="date" id="rFrom"></div>
    <div><label>ถึงวันที่ (ล่วงหน้าได้ 3 เดือน)</label><input type="date" id="rTo"></div>
  </div>
  <div class="row" style="margin:14px 0">
    <button class="btn" id="rShow">แสดงรายงาน</button>
    <button class="btn-y" id="rPrint" disabled>🖨 พิมพ์ / บันทึกเป็น PDF</button>
    <button class="btn-o" id="rClose">ปิด</button>
  </div>
  <div class="msg" id="rMsg"></div>
  <div class="tbl-wrap" id="rPreview"></div>
</div></div>

<div id="printArea"></div>

<script type="module">
/* ========================= ตั้งค่า (แก้ก่อนใช้งาน) ========================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD0K_3POj8iDtIG7CWzdMK0HT90QxA8RIQ",
  authDomain: "repair-sk-school.firebaseapp.com",
  projectId: "repair-sk-school",
  storageBucket: "repair-sk-school.firebasestorage.app",
  messagingSenderId: "68743044097",
  appId: "1:68743044097:web:b9478f73398a2418b17400"
};
// URL ของ Google Apps Script Web App (ดูไฟล์ apps-script.gs) ใช้อัปโหลดรูปไป Google Drive และส่งแจ้งเตือน AMALERT
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpUb3zF28uEXKiLuzmb4qIGQeQxTYG9LGAyaHL3UGnvDeT-8kdR9RZY_Nie5mo-zp0/exec";
const APPROVER_EMAIL = "nirutwong20@sakaeoschool.ac.th";
const MAX_BYTES = 2 * 1024 * 1024;
/* ======================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, doc, getDoc, query, orderBy, where, onSnapshot, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("th-TH", {day:"numeric",month:"short",year:"numeric"}) : "";
const ymd = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const STATUS = { wait:["รออนุมัติ","s-wait"], ok:["อนุมัติแล้ว","s-ok"], done:["ซ่อมเสร็จแล้ว","s-done"], no:["ไม่อนุมัติ","s-no"] };
const loc = r => [r.place, r.room ? "ห้อง " + r.room : ""].filter(Boolean).join(" ");
const show = (el, text, type) => { el.textContent = text; el.className = "msg " + type; };

let isAdmin = false, rows = [];
const withTimeout = (p, ms, text) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(text)), ms))]);
$("date").value = ymd(new Date());

/* ---------- บีบอัดรูปให้ ≤ 2MB ---------- */
async function compress(file){
  const bmp = await createImageBitmap(file);
  let scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height)), q = 0.9, blob;
  for (let i = 0; i < 12; i++){
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
    if (blob.size <= MAX_BYTES) return blob;
    q > 0.5 ? q -= 0.1 : scale *= 0.8;
  }
  throw new Error("ไม่สามารถลดขนาดรูปให้ไม่เกิน 2 MB ได้");
}
const toB64 = blob => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(blob);
});
async function callScript(payload){
  // ใช้ text/plain เพื่อเลี่ยง CORS preflight ของ Apps Script
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  let r;
  try { r = await fetch(APPS_SCRIPT_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload), signal: ctrl.signal }); }
  catch(err){ throw new Error(err.name === "AbortError" ? "Apps Script ไม่ตอบกลับภายใน 60 วินาที (ตรวจการ Deploy และสิทธิ์ Anyone)" : "เชื่อมต่อ Apps Script ไม่ได้: " + err.message); }
  finally { clearTimeout(timer); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "Apps Script error");
  return j;
}

$("files").addEventListener("change", e => {
  const fs = [...e.target.files].slice(0,3);
  $("thumbs").innerHTML = fs.map(f => `<div>${esc(f.name)} (${(f.size/1048576).toFixed(2)} MB)</div>`).join("");
});

/* ---------- ส่งฟอร์ม ---------- */
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("submitBtn"), msg = $("formMsg");
  btn.disabled = true; show(msg, "กำลังบันทึก…", "ok");
  try {
    const files = [...$("files").files].slice(0,3);
    const images = [];
    for (const f of files){
      show(msg, "กำลังย่อรูป…", "ok");
      const blob = await compress(f);
      show(msg, "กำลังอัปโหลดรูปไป Google Drive… (ครั้งแรกอาจใช้เวลาสักครู่)", "ok");
      const up = await callScript({ action:"upload", filename: Date.now()+"_"+f.name.replace(/\.[^.]+$/,"")+".jpg", mime:"image/jpeg", data: await toB64(blob) });
      images.push(up.url);
    }
    const data = {
      name: $("name").value.trim(), dept: $("dept").value, item: $("item").value.trim(), qty: Number($("qty").value),
      place: $("place").value.trim(), room: $("room").value.trim(), date: $("date").value, images, status:"wait", createdAt: serverTimestamp()
    };
    show(msg, "กำลังบันทึกข้อมูลลง Firebase…", "ok");
    const ref = await withTimeout(addDoc(collection(db,"repairs"), data), 20000,
      "บันทึกลง Firestore ไม่สำเร็จ: ตรวจว่าสร้างฐานข้อมูล Firestore แล้ว และ Rules อนุญาตให้เพิ่มข้อมูล");
    // แจ้งเตือน AMALERT (ผ่าน Apps Script) — ถ้าส่งไม่สำเร็จไม่ถือว่าบันทึกล้มเหลว
    callScript({ action:"notify", text:
      `🔧 แจ้งซ่อมใหม่\nผู้แจ้ง: ${data.name}\nสังกัด: ${data.dept}\nรายการ: ${data.item}\nจำนวน: ${data.qty}\nสถานที่: ${loc(data)}\nวันที่: ${thDate(data.date)}\n\n👉 กดเพื่ออนุมัติ: ${location.origin + location.pathname}?approve=${ref.id}` }).catch(console.warn);
    $("form").reset(); $("qty").value = "1"; $("date").value = ymd(new Date()); $("thumbs").innerHTML = "";
    show(msg, "ส่งเรื่องแจ้งซ่อมเรียบร้อยแล้ว", "ok");
  } catch(err){ console.error(err); show(msg, "เกิดข้อผิดพลาด: " + err.message, "err"); }
  btn.disabled = false;
});

/* ---------- ตารางรายการ ---------- */
function render(){
  const body = $("list");
  if (!rows.length){ body.innerHTML = `<tr><td colspan="9" class="empty">ยังไม่มีรายการแจ้งซ่อม</td></tr>`; return; }
  body.innerHTML = rows.map(r => {
    const [t,c] = STATUS[r.status] || STATUS.wait;
    const imgs = (r.images||[]).map((u,i) => `<a href="${esc(u)}" target="_blank" rel="noopener">รูป ${i+1}</a>`).join(" ") || "–";
    const B = (s, label, cls) => `<button class="${cls} btn-sm" data-id="${r.id}" data-s="${s}">${label}</button>`;
    const act = isAdmin ? `<td class="adm"><div class="row">${
      r.status === "wait" ? B("ok","อนุมัติ","btn") + B("no","ไม่อนุมัติ","btn-r") :
      r.status === "ok"   ? B("done","ซ่อมเสร็จแล้ว","btn-y") + B("wait","ย้อนสถานะ","btn-o") :
      r.status === "done" ? B("ok","ย้อนสถานะ","btn-o") :
                            B("wait","ย้อนสถานะ","btn-o")
    }</div></td>` : "";
    return `<tr><td>${thDate(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td><td>${esc(r.item)}</td><td>${esc(r.qty ?? 1)}</td><td>${esc(loc(r))}</td><td>${imgs}</td><td><span class="badge ${c}">${t}</span></td>${act}</tr>`;
  }).join("");
}
onSnapshot(query(collection(db,"repairs"), orderBy("date","desc")), snap => {
  rows = snap.docs.map(d => ({ id:d.id, ...d.data() })); render();
}, err => { $("list").innerHTML = `<tr><td colspan="9" class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(err.message)}</td></tr>`; });

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-id]"); if (!b || !isAdmin) return;
  b.disabled = true;
  try { await updateDoc(doc(db,"repairs",b.dataset.id), { status:b.dataset.s, approvedBy: auth.currentUser.email }); }
  catch(err){ alert("อัปเดตไม่สำเร็จ: " + err.message); b.disabled = false; }
});

/* ---------- เข้าสู่ระบบ ---------- */
const loginModal = $("loginModal"), approveModal = $("approveModal");
let pendingApprove = new URLSearchParams(location.search).get("approve");
const openLogin = note => {
  $("loginMsg").className = "msg";
  if (note) show($("loginMsg"), note, "ok");
  loginModal.classList.add("open"); $("email").focus();
};
$("loginBtn").onclick = () => openLogin();
$("loginCancel").onclick = () => loginModal.classList.remove("open");
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); $("pass").value=""; }
  catch(err){ show($("loginMsg"), "อีเมลหรือรหัสผ่านไม่ถูกต้อง", "err"); }
});
$("logout").onclick = () => signOut(auth);

/* ---------- Pop-up อนุมัติจากลิงก์ในแจ้งเตือน (ต้องล็อกอินก่อนเสมอ) ---------- */
function closeApprove(){
  approveModal.classList.remove("open"); pendingApprove = null;
  history.replaceState(null, "", location.pathname);
}
async function openApprove(){
  const id = pendingApprove; if (!id) return;
  $("apMsg").className = "msg"; $("apBtns").style.display = "";
  $("apBody").textContent = "กำลังโหลด…"; approveModal.classList.add("open");
  try {
    const s = await getDoc(doc(db,"repairs",id));
    if (!s.exists()){ $("apBody").textContent = "ไม่พบรายการนี้"; $("apBtns").style.display = "none"; $("apBtns").insertAdjacentElement("afterend", $("apMsg")); return; }
    const r = s.data();
    $("apBody").innerHTML = `<table><tbody>
      <tr><th>วันที่</th><td>${thDate(r.date)}</td></tr><tr><th>ผู้แจ้ง</th><td>${esc(r.name)}</td></tr>
      <tr><th>สังกัด</th><td>${esc(r.dept)}</td></tr><tr><th>รายการ</th><td>${esc(r.item)}</td></tr><tr><th>จำนวน</th><td>${esc(r.qty ?? 1)}</td></tr>
      <tr><th>สถานที่</th><td>${esc(loc(r))}</td></tr>
      <tr><th>รูป</th><td>${(r.images||[]).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">รูป ${i+1}</a>`).join(" ") || "–"}</td></tr>
      <tr><th>สถานะ</th><td>${(STATUS[r.status]||STATUS.wait)[0]}</td></tr></tbody></table>`;
    if (r.status !== "wait"){ $("apOk").style.display = $("apNo").style.display = "none"; }
    else { $("apOk").style.display = $("apNo").style.display = ""; }
  } catch(err){ $("apBody").textContent = "โหลดไม่สำเร็จ: " + err.message; }
}
async function setApprove(status){
  $("apOk").disabled = $("apNo").disabled = true;
  try {
    await updateDoc(doc(db,"repairs",pendingApprove), { status, approvedBy: auth.currentUser.email });
    show($("apMsg"), status === "ok" ? "อนุมัติเรียบร้อยแล้ว" : "บันทึกเป็นไม่อนุมัติแล้ว", "ok");
    $("apOk").style.display = $("apNo").style.display = "none";
  } catch(err){ show($("apMsg"), "ไม่สำเร็จ: " + err.message, "err"); }
  $("apOk").disabled = $("apNo").disabled = false;
}
$("apOk").onclick = () => setApprove("ok");
$("apNo").onclick = () => setApprove("no");
$("apClose").onclick = closeApprove;

onAuthStateChanged(auth, u => {
  isAdmin = !!u && u.email === APPROVER_EMAIL;
  if (u && !isAdmin){ signOut(auth); openLogin(); show($("loginMsg"), "บัญชีนี้ไม่มีสิทธิ์อนุมัติ", "err"); return; }
  $("loginBtn").style.display = isAdmin ? "none" : "";
  $("logout").style.display = isAdmin ? "" : "none";
  $("openReport").style.display = isAdmin ? "" : "none";   // ปุ่มรายงานแสดงเมื่อเข้าสู่ระบบเท่านั้น
  $("who").textContent = isAdmin ? u.email : "";
  document.querySelectorAll(".adm").forEach(el => el.style.display = isAdmin ? "" : "none");
  if (isAdmin){ loginModal.classList.remove("open"); if (pendingApprove) openApprove(); }
  else { modal.classList.remove("open"); if (pendingApprove) openLogin("กรุณาเข้าสู่ระบบเพื่ออนุมัติรายการ"); }
  render();
});

/* ---------- รายงาน ---------- */
const modal = $("reportModal");
function openReport(){
  const t = new Date(), min = new Date(t), max = new Date(t);
  min.setMonth(min.getMonth()-3); max.setMonth(max.getMonth()+3);
  for (const id of ["rFrom","rTo"]){ $(id).min = ymd(min); $(id).max = ymd(max); }
  $("rFrom").value = ymd(min); $("rTo").value = ymd(t);
  $("rPreview").innerHTML = ""; $("rMsg").className = "msg"; $("rPrint").disabled = true;
  modal.classList.add("open");
}
$("openReport").onclick = openReport;
$("rClose").onclick = () => modal.classList.remove("open");

function reportTable(list){
  if (!list.length) return `<div class="empty">ไม่พบรายการในช่วงวันที่ที่เลือก</div>`;
  return `<table><thead><tr><th>#</th><th>วันที่</th><th>ผู้แจ้ง</th><th>สังกัด</th><th>รายการ</th><th>จำนวน</th><th>สถานที่</th><th>สถานะ</th></tr></thead><tbody>` +
    list.map((r,i) => `<tr><td>${i+1}</td><td>${thDate(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.dept)}</td><td>${esc(r.item)}</td><td>${esc(r.qty ?? 1)}</td><td>${esc(loc(r))}</td><td>${(STATUS[r.status]||STATUS.wait)[0]}</td></tr>`).join("") +
    `</tbody></table>`;
}
$("rShow").onclick = async () => {
  const from = $("rFrom").value, to = $("rTo").value, m = $("rMsg");
  if (!from || !to) return show(m, "กรุณาเลือกวันที่ให้ครบ", "err");
  if (from > to) return show(m, "วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด", "err");
  if (from < $("rFrom").min || to > $("rTo").max) return show(m, "เลือกได้เฉพาะช่วงย้อนหลัง 3 เดือน ถึงล่วงหน้า 3 เดือน", "err");
  try {
    const snap = await getDocs(query(collection(db,"repairs"), where("date",">=",from), where("date","<=",to), orderBy("date","asc")));
    const list = snap.docs.map(d => d.data());
    m.className = "msg";
    $("rPreview").innerHTML = reportTable(list);
    $("printArea").innerHTML = `<h2>รายงานการแจ้งซ่อม งานอาคารสถานที่</h2>
      <div>ช่วงวันที่ ${thDate(from)} – ${thDate(to)} | พิมพ์เมื่อ ${new Date().toLocaleDateString("th-TH",{dateStyle:"long"})} | รวม ${list.length} รายการ</div><br>` + reportTable(list);
    $("rPrint").disabled = !list.length;
  } catch(err){ show(m, "โหลดรายงานไม่สำเร็จ: " + err.message, "err"); }
};
$("rPrint").onclick = () => window.print();
</script>
